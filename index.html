<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="banner"></div>

        <script>
            // Populate the banner section
            fetch('banner.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('banner').innerHTML = data;
                })
                .catch(error => console.error('Error loading banner:', error))
        </script>

        <header>
             <div id="navbar"></div>
            <script>
            fetch('navbar.html')
                .then(response => response.text())
                .then(html => { document.getElementById('navbar').innerHTML = html; })
                .catch(err => console.error('Error loading navbar:', err));
            </script>
        </header>

        <main>
            <section id="carousel" class="carousel-container">
                <div class="carousel">
                    <img src="family-pictures/pexels-lenzatic-26967754.jpg" alt="Family gathering outdoors" class="active">
                    <img src="family-pictures/pexels-_brunovisual-1157201511-27196681.jpg" alt="Outdoor family portrait">
                </div>
            </section>

            <section id="index">
                <p>Welcome to our family website. Explore our Puerto Rican history, family photos, calendar of gatherings, message board, and contact information.</p>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 My Website. All rights reserved.</p>
        </footer>

        <script>
            let currentImageIndex = 0;
            const images = document.querySelectorAll('.carousel img');
            const totalImages = images.length;

            function showImage(index) {
                images.forEach(img => img.classList.remove('active'));
                images[index].classList.add('active');
            }

            function nextImage() {
                currentImageIndex = (currentImageIndex + 1) % totalImages;
                showImage(currentImageIndex);
            }

            // Initialize carousel
            showImage(currentImageIndex);

            // Auto-rotate every 4 seconds
            setInterval(nextImage, 4000);
        </script>
    </body>
</html>
