<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>History - My Website</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="banner"></div>

        <script>
            // Populate the banner section
            fetch('banner.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('banner').innerHTML = data;
                })
                .catch(error => console.error('Error loading banner:', error))
        </script>

        <div id="navbar"></div>
        <script>
            fetch('navbar.html')
                .then(response => response.text())
                .then(html => { document.getElementById('navbar').innerHTML = html; })
                .catch(error => console.error('Error loading navbar:', error));
        </script>

        <main>
            <section id="history">
                <h2>History</h2>
                <p>The history of the Corretjer Family goes back several generations, with roots in Spain, the Balearic Islands, Africa, and other parts of Europe.</p>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 My Website. All rights reserved.</p>
        </footer>
    </body>
</html>
